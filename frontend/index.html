<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartilhar Câmera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- MODO TRANSMISSOR (Envia câmera) -->
        <div id="transmitterMode" class="mode">
            <div class="camera-icon" id="cameraIcon" onclick="iniciarTransmissao()" title="Clique para compartilhar câmera">
                📷
            </div>
            <p class="instruction">Clique na foto para compartilhar sua câmera</p>
            <div id="transmitterStatus" class="status"></div>
            
            <!-- QR Code -->
            <div id="qrContainer" style="display: none;">
                <h3>Compartilhe este link:</h3>
                <div id="qrCode"></div>
                <input type="text" id="shareLink" readonly class="link-input">
                <button onclick="copiarLink()" class="btn-copy">📋 Copiar Link</button>
            </div>
        </div>

        <!-- MODO RECEPTOR (Recebe câmera) -->
        <div id="receiverMode" class="mode" style="display: none;">
            <h2>📹 Câmera Compartilhada</h2>
            <video id="remoteVideo" class="video-stream" autoplay playsinline></video>
            <div id="receiverStatus" class="status"></div>
            <button onclick="desconectarReceptor()" class="btn-disconnect">❌ Desconectar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
